<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="certBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090e22" />
      <stop offset="100%" stop-color="#040612" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(56,189,248,0.08)" />
      <stop offset="100%" stop-color="rgba(56,189,248,0)" />
    </radialGradient>
  </defs>

  <!-- Fondo Minimalista -->
  <rect width="1000" height="700" rx="32" fill="url(#certBg)" />
  <rect width="1000" height="700" rx="32" fill="url(#centerGlow)" />

  <!-- Marco Squircle Fino y Sofisticado -->
  <rect x="28" y="28" width="944" height="644" rx="24" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" />
  <rect x="36" y="36" width="928" height="628" rx="18" fill="none" stroke="rgba(56,189,248,0.22)" stroke-width="0.8" />

  <!-- Puntos astronómicos en las 4 esquinas -->
  <circle cx="56" cy="56" r="2.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="944" cy="56" r="2.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="56" cy="644" r="2.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="944" cy="644" r="2.5" fill="#38bdf8" opacity="0.6" />

  <!-- Cabecera Discreta -->
  <circle cx="500" cy="80" r="3.5" fill="#38bdf8" />
  <text x="500" y="108" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="1.2" fill="#7ee8fa">Cyberpenguin: The Explorers We Must Never Forget · Archivos de la NASA</text>

  <!-- Título del Diploma -->
  <text x="500" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="0.4" fill="#ffffff">Diploma de honor astronáutico</text>
  <line x1="430" y1="182" x2="570" y2="182" stroke="rgba(255,255,255,0.2)" stroke-width="1" />

  <!-- Concesión -->
  <text x="500" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#94a3b8">Conferido con mérito a:</text>

  <!-- Nombre del Cadete -->
  <text x="500" y="278" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="36" font-weight="800" fill="#ffffff">Explorador cósmico</text>

  <!-- Mérito Educativo -->
  <text x="500" y="324" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="400" fill="#cbd5e1">Por completar con éxito la expedición cósmica y explorar las 6 sondas espaciales pioneras.</text>

  <!-- Píldora de Rango y Estrellas -->
  <g transform="translate(340, 356)">
    <rect x="0" y="0" width="320" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="160" y="21.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#fde047">★ 0/15 estrellas cósmicas · Rango: Aprendiz</text>
  </g>

  <!-- Sello Central Oficial con Huella del Pingüino -->
  <g transform="translate(500, 464)">
    <circle cx="0" cy="0" r="42" fill="rgba(56,189,248,0.06)" stroke="rgba(56,189,248,0.3)" stroke-width="1.2" />
    <circle cx="0" cy="0" r="36" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="0.8" stroke-dasharray="3 2" />
    <g transform="translate(-28, -28)">
      
    </g>
  </g>

  <!-- Firmas Minimalistas -->
  <!-- Izquierda: Cyberpenguin -->
  <g transform="translate(260, 560)">
    <line x1="-80" y1="0" x2="80" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="0" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Cyberpenguin</text>
    <text x="0" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Comandante de vuelo</text>
  </g>

  <!-- Derecha: IA de la Nave -->
  <g transform="translate(740, 560)">
    <line x1="-80" y1="0" x2="80" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="0" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">IA de la nave (Paulina)</text>
    <text x="0" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Control de misión</text>
  </g>

  <!-- Pie de Página -->
  <text x="50" y="650" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b">NASA-CP-2026-X89</text>
  <text x="950" y="650" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b">Fecha: 15 de noviembre de 2026</text>
</svg>