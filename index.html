<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyberpenguins</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: [
              '-apple-system',
              'BlinkMacSystemFont',
              '"SF Pro Display"',
              '"SF Pro Text"',
              '"Plus Jakarta Sans"',
              'Inter',
              'system-ui',
              'sans-serif'
            ]
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="font-sans antialiased">
  <div class="starfield" aria-hidden="true"></div>

  <!-- Sugerencia de visualización horizontal en dispositivos verticales -->
  <div id="orientation-banner"
    class="orientation-banner fixed inset-0 z-50 items-center justify-center bg-slate-950/85 backdrop-blur-xl p-6">
    <div class="squircle-panel max-w-xs w-full p-6 text-center flex flex-col items-center justify-center gap-4">
      <svg viewBox="0 0 64 48" width="52" height="40" aria-hidden="true">
        <rect x="6" y="8" width="52" height="32" rx="8" fill="none" stroke="#7ee8fa" stroke-width="2" />
        <polygon points="28,20 38,24 28,28" fill="#ffbe76" />
      </svg>
      <p class="text-sm font-medium tracking-tight text-slate-100 text-center">Vista horizontal recomendada</p>
      <button id="dismiss-orientation-btn" type="button"
        class="squircle-btn inline-flex items-center justify-center text-center px-5 py-2 text-sm font-medium bg-white/90 hover:bg-white text-slate-950">
        Continuar
      </button>
    </div>
  </div>

  <!-- Cinemática Inicial: Plataforma de Lanzamiento en la Tierra -->
  <section id="launch-screen" class="launch-screen launch-earth-bg" aria-label="Lanzamiento inicial">
    <!-- Cielo terrestre, nubes y reflectores del complejo de lanzamiento -->
    <svg class="launch-earth-sky" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs>
        <linearGradient id="earthSkyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#050a1c" />
          <stop offset="48%" stop-color="#143266" />
          <stop offset="86%" stop-color="#3c79b5" />
          <stop offset="100%" stop-color="#84bfe8" />
        </linearGradient>
        <linearGradient id="beamGrad" x1="0.5" y1="1" x2="0.5" y2="0">
          <stop offset="0%" stop-color="rgba(160,235,255,0.22)" />
          <stop offset="100%" stop-color="rgba(160,235,255,0)" />
        </linearGradient>
      </defs>
      <rect width="1200" height="700" fill="url(#earthSkyGrad)" />
      <!-- Estrellas tenues en lo alto de la atmósfera -->
      <g fill="#ffffff" opacity="0.65">
        <circle cx="140" cy="60" r="1.3" />
        <circle cx="380" cy="42" r="1.5" />
        <circle cx="620" cy="75" r="1.2" />
        <circle cx="940" cy="52" r="1.6" />
        <circle cx="1080" cy="95" r="1.1" />
      </g>
      <!-- Nubes estratosféricas -->
      <ellipse cx="220" cy="430" rx="190" ry="34" fill="rgba(255,255,255,0.16)" />
      <ellipse cx="960" cy="390" rx="220" ry="38" fill="rgba(255,255,255,0.14)" />
      <!-- Haces de reflectores de plataforma -->
      <polygon points="360,620 210,160 330,160" fill="url(#beamGrad)" />
      <polygon points="840,620 870,160 990,160" fill="url(#beamGrad)" />
      <!-- Horizonte terrestre -->
      <path d="M 0,605 Q 600,575 1200,605 L 1200,700 L 0,700 Z" fill="#172440" />
      <path d="M 0,625 Q 600,595 1200,625 L 1200,700 L 0,700 Z" fill="#0f182e" />
    </svg>

    <!-- Cartela minimalista de apertura -->
    <div id="launch-title-card"
      class="launch-title-card pointer-events-none relative z-10 text-center flex flex-col items-center justify-center gap-1.5 pt-2">
      <span class="text-[11px] font-medium uppercase tracking-[0.28em] text-cyan-200/80 text-center">La Tierra</span>
      <h1 class="text-2xl sm:text-4xl font-semibold tracking-[-0.025em] text-white/95 text-center">Cyberpenguins</h1>
    </div>

    <div class="relative z-10 w-full flex flex-col items-center justify-center my-auto">
      <div class="relative flex items-end justify-center">
        <!-- Torre umbilical con brazos retráctiles -->
        <svg viewBox="0 0 110 230" width="92" height="200" aria-hidden="true" class="-mr-12 mb-7 opacity-95">
          <defs>
            <linearGradient id="towerGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#5d6ea3" />
              <stop offset="100%" stop-color="#283254" />
            </linearGradient>
          </defs>
          <rect x="20" y="22" width="24" height="204" fill="url(#towerGrad)" stroke="#889cd4" stroke-width="1.2" />
          <g stroke="#9fb3e6" stroke-width="1.3">
            <line x1="20" y1="45" x2="44" y2="68" />
            <line x1="44" y1="45" x2="20" y2="68" />
            <line x1="20" y1="88" x2="44" y2="111" />
            <line x1="44" y1="88" x2="20" y2="111" />
            <line x1="20" y1="131" x2="44" y2="154" />
            <line x1="44" y1="131" x2="20" y2="154" />
            <line x1="20" y1="174" x2="44" y2="197" />
            <line x1="44" y1="174" x2="20" y2="197" />
          </g>
          <!-- Brazos umbilicales retráctiles -->
          <g id="gantry-arm-top" class="gantry-arm">
            <rect x="44" y="72" width="46" height="8" rx="2" fill="#b4c4eb" />
            <circle cx="88" cy="76" r="3" fill="#ffbe76" />
          </g>
          <g id="gantry-arm-mid" class="gantry-arm">
            <rect x="44" y="132" width="38" height="7" rx="2" fill="#8ea1d4" />
          </g>
          <circle cx="32" cy="14" r="4" fill="#ffbe76" />
          <line x1="32" y1="22" x2="32" y2="14" stroke="#c8d4f2" stroke-width="2" />
        </svg>

        <div id="launch-ship-wrapper" class="launch-ship-wrapper">
          <div id="launch-ship-svg"></div>
        </div>
      </div>

      <!-- Nubes de vapor de ignición -->
      <div id="launch-steam" class="launch-steam" aria-hidden="true">
        <span class="steam-puff puff-1"></span>
        <span class="steam-puff puff-2"></span>
        <span class="steam-puff puff-3"></span>
        <span class="steam-puff puff-4"></span>
      </div>

      <!-- Plataforma técnica con trinchera de llamas -->
      <svg viewBox="0 0 360 76" width="320" height="68" aria-hidden="true" class="-mt-7">
        <defs>
          <linearGradient id="padSurface" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#455587" />
            <stop offset="100%" stop-color="#1d2647" />
          </linearGradient>
        </defs>
        <ellipse cx="180" cy="46" rx="160" ry="24" fill="#131930" stroke="#5b6ea3" stroke-width="1.5" />
        <ellipse cx="180" cy="40" rx="136" ry="20" fill="url(#padSurface)" stroke="#7ee8fa" stroke-opacity="0.4"
          stroke-width="1.2" />
        <ellipse cx="180" cy="40" rx="84" ry="12" fill="#0d1326" stroke="#ffbe76" stroke-opacity="0.55"
          stroke-width="1.4" />
        <circle cx="72" cy="40" r="3.2" fill="#ffbe76" />
        <circle cx="288" cy="40" r="3.2" fill="#ffbe76" />
        <circle cx="122" cy="54" r="2.6" fill="#7ee8fa" />
        <circle cx="238" cy="54" r="2.6" fill="#7ee8fa" />
      </svg>
    </div>

    <div class="pb-1 relative z-10 w-full flex justify-end px-4">
      <button id="launch-btn" type="button" aria-label="Despegar"
        class="squircle-btn w-11 h-11 inline-flex items-center justify-center text-center bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/15 text-slate-100">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="5 4 15 12 5 20 5 4" fill="currentColor" stroke="none" />
          <line x1="19" y1="5" x2="19" y2="19" />
        </svg>
      </button>
    </div>
  </section>

  <!-- Cinemática de Viaje Espacial entre Destinos -->
  <section id="travel-cinematic" class="travel-cinematic is-hidden" aria-label="Viaje espacial">
    <div id="travel-cinematic-stage" class="travel-cinematic-stage"></div>
    <div class="travel-cinematic-ui">
      <div class="travel-cinematic-meta">
        <div id="travel-cinematic-dots" class="travel-cinematic-dots" aria-hidden="true"></div>
        <p id="travel-cinematic-caption"
          class="travel-cinematic-caption text-[11px] sm:text-xs font-medium uppercase tracking-[0.2em] text-slate-200/90"></p>
      </div>
      <button id="travel-skip-btn" type="button" aria-label="Saltar"
        class="squircle-btn w-10 h-10 flex items-center justify-center bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/15 text-slate-100 shrink-0">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="5 4 15 12 5 20 5 4" fill="currentColor" stroke="none" />
          <line x1="19" y1="5" x2="19" y2="19" />
        </svg>
      </button>
    </div>
  </section>

  <!-- Pantalla Inicial: Avances de Misión y Descarga de Certificado -->
  <section id="home-screen" class="home-screen is-hidden" aria-label="Pantalla inicial">
    <svg class="cosmic-panorama-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <radialGradient id="bgNebulaCyan" cx="18%" cy="22%" r="48%">
          <stop offset="0%" stop-color="rgba(56, 189, 248, 0.24)" />
          <stop offset="45%" stop-color="rgba(37, 99, 235, 0.12)" />
          <stop offset="100%" stop-color="rgba(6, 9, 20, 0)" />
        </radialGradient>
        <radialGradient id="bgNebulaViolet" cx="56%" cy="46%" r="52%">
          <stop offset="0%" stop-color="rgba(139, 92, 246, 0.2)" />
          <stop offset="48%" stop-color="rgba(59, 130, 246, 0.08)" />
          <stop offset="100%" stop-color="rgba(6, 9, 20, 0)" />
        </radialGradient>
        <radialGradient id="bgNebulaAmber" cx="84%" cy="74%" r="46%">
          <stop offset="0%" stop-color="rgba(251, 146, 60, 0.2)" />
          <stop offset="50%" stop-color="rgba(180, 83, 9, 0.09)" />
          <stop offset="100%" stop-color="rgba(6, 9, 20, 0)" />
        </radialGradient>
        <radialGradient id="bgEarthAtmosphere" cx="18%" cy="96%" r="42%">
          <stop offset="0%" stop-color="rgba(126, 232, 250, 0.55)" />
          <stop offset="32%" stop-color="rgba(37, 99, 235, 0.34)" />
          <stop offset="68%" stop-color="rgba(15, 23, 42, 0.14)" />
          <stop offset="100%" stop-color="rgba(6, 9, 20, 0)" />
        </radialGradient>
        <radialGradient id="bgEarthDisc" cx="35%" cy="28%" r="72%">
          <stop offset="0%" stop-color="#1e40af" />
          <stop offset="55%" stop-color="#0f2354" />
          <stop offset="100%" stop-color="#040817" />
        </radialGradient>
        <radialGradient id="bgMoonDisc" cx="34%" cy="32%" r="68%">
          <stop offset="0%" stop-color="#dbe4f7" />
          <stop offset="48%" stop-color="#8b96b3" />
          <stop offset="86%" stop-color="#3c4663" />
          <stop offset="100%" stop-color="#171d33" />
        </radialGradient>
        <radialGradient id="bgMarsDisc" cx="32%" cy="32%" r="70%">
          <stop offset="0%" stop-color="#fdbb8c" />
          <stop offset="42%" stop-color="#d4663f" />
          <stop offset="82%" stop-color="#6b2318" />
          <stop offset="100%" stop-color="#1f0a10" />
        </radialGradient>
        <radialGradient id="bgAldebaranGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(255, 240, 204, 0.95)" />
          <stop offset="18%" stop-color="rgba(255, 185, 110, 0.52)" />
          <stop offset="52%" stop-color="rgba(234, 88, 12, 0.16)" />
          <stop offset="100%" stop-color="rgba(234, 88, 12, 0)" />
        </radialGradient>
        <linearGradient id="bgErosGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#9ca6bf" />
          <stop offset="55%" stop-color="#5d657d" />
          <stop offset="100%" stop-color="#272d3d" />
        </linearGradient>
      </defs>

      <!-- Nebulosas volumétricas de fondo -->
      <rect width="1920" height="1080" fill="url(#bgNebulaCyan)" />
      <rect width="1920" height="1080" fill="url(#bgNebulaViolet)" />
      <rect width="1920" height="1080" fill="url(#bgNebulaAmber)" />
      <path d="M -80,920 C 320,660 660,540 1060,420 C 1380,320 1650,180 2020,-40"
        fill="none" stroke="rgba(126, 232, 250, 0.08)" stroke-width="190" stroke-linecap="round" />
      <path d="M 140,1040 C 560,760 880,620 1340,460 C 1580,375 1820,250 1980,90"
        fill="none" stroke="rgba(167, 139, 250, 0.07)" stroke-width="120" stroke-linecap="round" />

      <!-- Arcos orbitales continuos muy sutiles -->
      <ellipse cx="960" cy="600" rx="1080" ry="390" transform="rotate(-14 960 600)"
        fill="none" stroke="rgba(126, 232, 250, 0.08)" stroke-width="1.2" />
      <ellipse cx="980" cy="560" rx="840" ry="270" transform="rotate(8 980 560)"
        fill="none" stroke="rgba(255, 190, 118, 0.07)" stroke-width="1" />

      <!-- Campo estelar profundo -->
      <g fill="#f8fafc">
        <circle cx="96" cy="118" r="1.4" opacity="0.72" />
        <circle cx="242" cy="74" r="1.1" opacity="0.58" />
        <circle cx="388" cy="196" r="1.7" fill="#bae6fd" opacity="0.82" />
        <circle cx="512" cy="92" r="1.2" opacity="0.62" />
        <circle cx="678" cy="154" r="1.5" fill="#fde68a" opacity="0.76" />
        <circle cx="845" cy="84" r="1.2" opacity="0.54" />
        <circle cx="1014" cy="128" r="1.6" fill="#ddd6fe" opacity="0.78" />
        <circle cx="1180" cy="68" r="1.1" opacity="0.55" />
        <circle cx="1340" cy="148" r="1.5" opacity="0.68" />
        <circle cx="1495" cy="88" r="1.3" fill="#bae6fd" opacity="0.74" />
        <circle cx="1790" cy="126" r="1.6" opacity="0.72" />
        <circle cx="142" cy="390" r="1.3" opacity="0.65" />
        <circle cx="88" cy="585" r="1.6" fill="#7ee8fa" opacity="0.76" />
        <circle cx="176" cy="740" r="1.2" opacity="0.58" />
        <circle cx="1835" cy="410" r="1.5" opacity="0.72" />
        <circle cx="1765" cy="680" r="1.3" fill="#fed7aa" opacity="0.74" />
        <circle cx="1862" cy="915" r="1.6" opacity="0.68" />
        <circle cx="1420" cy="990" r="1.4" fill="#bae6fd" opacity="0.72" />
        <circle cx="1065" cy="1015" r="1.2" opacity="0.6" />
        <circle cx="720" cy="995" r="1.5" opacity="0.65" />
      </g>

      <!-- La Luna en el cuadrante superior izquierdo -->
      <g opacity="0.86">
        <circle cx="215" cy="205" r="118" fill="rgba(126, 232, 250, 0.08)" />
        <circle cx="215" cy="205" r="88" fill="url(#bgMoonDisc)" />
        <ellipse cx="185" cy="176" rx="22" ry="15" fill="rgba(51, 65, 95, 0.35)" />
        <ellipse cx="238" cy="222" rx="18" ry="22" fill="rgba(51, 65, 95, 0.28)" />
        <circle cx="172" cy="228" r="11" fill="rgba(71, 85, 118, 0.45)" stroke="rgba(226, 232, 240, 0.25)" stroke-width="1" />
        <circle cx="228" cy="168" r="8" fill="rgba(71, 85, 118, 0.38)" />
        <path d="M 236,120 A 88,88 0 0,1 236,290 A 56,88 0 0,0 236,120 Z" fill="rgba(6, 9, 20, 0.48)" />
      </g>

      <!-- Limbo atmosférico de La Tierra en la esquina inferior izquierda -->
      <g>
        <circle cx="210" cy="1130" r="420" fill="url(#bgEarthAtmosphere)" />
        <circle cx="210" cy="1130" r="345" fill="url(#bgEarthDisc)" />
        <path d="M -80,990 A 345,345 0 0,1 515,965" fill="none" stroke="rgba(126, 232, 250, 0.55)" stroke-width="5" />
        <path d="M 25,950 Q 175,905 325,935" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="12" stroke-linecap="round" />
      </g>

      <!-- Aldebarán y Asteroide 433 Eros en el sector superior derecho -->
      <g>
        <circle cx="1685" cy="195" r="135" fill="url(#bgAldebaranGlow)" />
        <circle cx="1685" cy="195" r="14" fill="#ffe1a8" />
        <circle cx="1685" cy="195" r="7" fill="#fffaf0" />
        <g transform="translate(1525, 245) rotate(-16)" opacity="0.82">
          <path d="M -26,4 C -24,-10 -8,-17 12,-14 C 28,-11 36,-1 30,9 C 22,18 -6,19 -20,14 C -26,11 -27,8 -26,4 Z"
            fill="url(#bgErosGrad)" stroke="rgba(203, 213, 225, 0.3)" stroke-width="1.2" />
          <ellipse cx="-6" cy="-1" rx="6" ry="3.5" fill="rgba(15, 23, 42, 0.5)" />
        </g>
      </g>

      <!-- Marte en el sector derecho inferior -->
      <g opacity="0.88">
        <circle cx="1745" cy="790" r="188" fill="rgba(249, 115, 22, 0.14)" />
        <circle cx="1745" cy="790" r="138" fill="url(#bgMarsDisc)" />
        <path d="M 1645,785 Q 1740,758 1848,796 Q 1795,826 1672,812 Z" fill="rgba(69, 20, 14, 0.42)" />
        <path d="M 1695,660 Q 1745,680 1795,660 Q 1745,648 1695,660 Z" fill="rgba(255, 244, 236, 0.45)" />
        <path d="M 1775,656 A 138,138 0 0,1 1775,924 A 88,138 0 0,0 1775,656 Z" fill="rgba(6, 9, 20, 0.56)" />
      </g>
    </svg>
    <div class="squircle-panel home-panel max-w-6xl w-full p-6 sm:p-9 lg:p-10 flex flex-col gap-6 sm:gap-7">
      <header class="flex flex-wrap items-center justify-between gap-4 text-center">
        <div class="flex items-center justify-center gap-3.5 text-center">
          <div class="w-11 h-11 rounded-2xl bg-cyan-300/10 border border-cyan-300/25 flex items-center justify-center shrink-0">
            <svg viewBox="0 0 40 40" width="26" height="26" aria-hidden="true">
              <circle cx="20" cy="20" r="13" fill="none" stroke="#7ee8fa" stroke-width="1.6" stroke-opacity="0.7" />
              <ellipse cx="20" cy="20" rx="17" ry="6.5" transform="rotate(-24 20 20)" fill="none" stroke="#ffbe76" stroke-width="1.5" />
              <circle cx="20" cy="20" r="4.5" fill="#7ee8fa" />
            </svg>
          </div>
          <h1 class="text-2xl sm:text-4xl font-semibold tracking-[-0.03em] text-white text-center">Cyberpenguins</h1>
        </div>
        <div class="flex items-center justify-center gap-3">
          <button id="home-start-btn" type="button"
            class="squircle-btn inline-flex items-center justify-center text-center px-6 py-3 text-sm sm:text-base font-medium bg-white text-slate-950 hover:bg-cyan-100 shadow-lg shadow-cyan-500/10">
            Explorar
          </button>
          <button id="reset-progress-btn" type="button" title="Reiniciar" aria-label="Reiniciar"
            class="squircle-btn w-11 h-11 inline-flex items-center justify-center text-center bg-white/[0.08] hover:bg-rose-400/20 border border-white/15 text-slate-200">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
              <path d="M3 3v5h5" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Avances por Destino -->
      <section id="home-chapters-grid" aria-label="Lugares">
        <div id="chapter-nav" class="grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-5 items-stretch"></div>
      </section>

      <!-- Pasaporte, Insignias y Certificado -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-5 items-stretch">
        <section class="squircle-card p-5 sm:p-6 flex flex-col items-center justify-between text-center gap-4 h-full">
          <div class="w-full flex items-center justify-center gap-2 text-center">
            <span class="text-sm sm:text-base font-medium text-slate-100 text-center">Pasaporte</span>
            <span id="hud-passport-count"
              class="squircle-pill inline-flex items-center justify-center text-center px-2.5 py-0.5 text-[11px] font-medium bg-amber-300/10 text-amber-200 border border-amber-300/20">0/3</span>
          </div>
          <div id="home-passport-slots" class="w-full grid grid-cols-3 gap-2"></div>
          <button id="open-passport-btn" type="button"
            class="squircle-btn w-full inline-flex items-center justify-center text-center px-3 py-2.5 text-xs sm:text-sm font-medium bg-white/[0.08] hover:bg-white/[0.15] text-slate-100">
            Ver pasaporte
          </button>
        </section>

        <section class="squircle-card p-5 sm:p-6 flex flex-col items-center justify-between text-center gap-4 h-full">
          <div class="w-full flex items-center justify-center gap-2 text-center">
            <span id="hud-badge-name" class="text-sm sm:text-base font-medium text-cyan-200 text-center">Aprendiz</span>
            <span id="home-total-stars"
              class="squircle-pill inline-flex items-center justify-center text-center px-2.5 py-0.5 text-[11px] font-medium bg-amber-300/10 text-amber-200 border border-amber-300/20">★ 0/15</span>
          </div>
          <div id="home-badges-grid" class="w-full grid grid-cols-5 gap-1.5"></div>
          <button id="open-badges-btn" type="button"
            class="squircle-btn w-full inline-flex items-center justify-center text-center px-3 py-2.5 text-xs sm:text-sm font-medium bg-white/[0.08] hover:bg-white/[0.15] text-slate-100">
            Ver insignias
          </button>
        </section>

        <section class="squircle-card p-5 sm:p-6 flex flex-col items-center justify-between text-center gap-4 h-full">
          <div class="w-full flex items-center justify-center gap-2 text-center">
            <span class="text-sm sm:text-base font-medium text-slate-100 text-center">Certificado</span>
            <span id="home-chapters-completed-count"
              class="squircle-pill inline-flex items-center justify-center text-center px-2.5 py-0.5 text-[11px] font-medium bg-cyan-300/10 text-cyan-200 border border-cyan-300/20">0/3</span>
          </div>
          <div id="home-certificate-preview"
            class="certificate-card-preview w-full min-h-[96px] rounded-2xl bg-white/[0.045] border border-white/[0.08] p-3 flex flex-col items-center justify-center gap-1.5 text-center"></div>
          <p id="home-certificate-status" class="text-xs font-normal text-slate-400 text-center empty:hidden"></p>
          <div class="w-full flex flex-wrap items-center justify-center gap-2.5">
            <button id="open-certificate-btn" type="button" disabled
              class="squircle-btn flex-1 inline-flex items-center justify-center text-center px-3 py-2.5 text-xs sm:text-sm font-medium bg-white/[0.08] hover:bg-white/[0.15] text-slate-100">
              Ver
            </button>
            <button id="home-download-certificate-btn" type="button" disabled
              class="squircle-btn flex-1 inline-flex items-center justify-center text-center px-3 py-2.5 text-xs sm:text-sm font-medium bg-amber-300 hover:bg-amber-200 text-slate-950">
              Descargar
            </button>
          </div>
        </section>
      </div>
    </div>
  </section>

  <!-- Escenario Principal del Juego (sin texto aparte de los diálogos y cartelas) -->
  <main id="game-screen" class="game-shell is-hidden" aria-label="Cyberpenguins">
    <!-- Maqueta Isométrica Navegable -->
    <section class="stage-viewport">
      <div id="iso-board" class="iso-board" role="application" aria-label="Escenario espacial" tabindex="0">
        <div id="stage-backdrop-layer" class="iso-backdrop"></div>
        <canvas id="stage-fx-canvas" class="stage-fx-canvas" aria-hidden="true"></canvas>
        <svg id="eva-tether-layer" class="eva-tether-layer is-hidden" viewBox="0 0 1000 594" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div id="stage-entities-layer"></div>
        <div id="stage-lighting-overlay" class="stage-lighting-overlay" aria-hidden="true"></div>

        <!-- Botón flotante sin texto para regresar a la pantalla inicial -->
        <button id="back-home-btn" type="button" aria-label="Pantalla inicial" class="back-home-btn squircle-btn">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 10.5L12 3l9 7.5" />
            <path d="M5 9.5V20h14V9.5" />
            <path d="M9.5 20v-6h5v6" />
          </svg>
        </button>

        <!-- Píldora minimalista de ubicación -->
        <div id="stage-location-pill" class="stage-location-pill" aria-live="polite"></div>

        <!-- Control minimalista de paisaje sonoro ambiental -->
        <button id="sound-toggle-btn" type="button" aria-label="Alternar sonido ambiental" aria-pressed="true"
          class="sound-toggle-btn squircle-btn">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <path class="sound-wave-1" d="M15.54 8.46a5 5 0 0 1 0 7.07" />
            <path class="sound-wave-2" d="M18.7 5.3a9.5 9.5 0 0 1 0 13.4" />
          </svg>
        </button>

        <!-- Cartela cinematográfica de capítulo estilo Monument Valley -->
        <div id="chapter-title-card" class="chapter-title-card is-hidden" aria-hidden="true">
          <span id="chapter-card-numeral" class="chapter-card-numeral"></span>
          <h2 id="chapter-card-title" class="chapter-card-title"></h2>
          <div class="chapter-card-divider">
            <span class="chapter-card-line"></span>
            <span class="chapter-card-diamond"></span>
            <span class="chapter-card-line"></span>
          </div>
          <p id="chapter-card-subtitle" class="chapter-card-subtitle"></p>
        </div>

        <!-- Personaje Jugable: Cyberpenguin -->
        <div id="penguin-actor" class="penguin-actor">
          <div id="penguin-sprite" class="penguin-sprite"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Diálogo Inferior Flotante Centrado: Cápsula Apple TV+ / Monument Valley -->
  <div id="dialogue-modal" class="dialogue-bottom-bar is-hidden" role="dialog" aria-modal="false"
    aria-labelledby="dialogue-machine-name">
    <div class="dialogue-squircle-box">
      <div id="dialogue-machine-preview"
        class="squircle-card w-11 h-11 flex items-center justify-center p-1.5 shrink-0"></div>
      <div class="flex-1 min-w-0 flex flex-col items-center justify-center text-center gap-0.5">
        <span id="dialogue-machine-name" class="dialogue-speaker-tag dialogue-speaker-penguin text-center">Cyberpenguin</span>
        <div id="dialogue-blank-slot" class="blank-template-slot dialogue-line-slot w-full justify-center text-center"></div>
      </div>
    </div>
  </div>

  <!-- Modal 2: Escotilla de Nave & 3 Espacios de Quiz (2 preguntas x 4 opciones en blanco) -->
  <div id="quiz-modal" class="modal-overlay is-hidden" role="dialog" aria-modal="true" aria-label="Quiz">
    <div class="squircle-panel max-w-2xl w-full p-5 sm:p-6 flex flex-col gap-4 max-h-[90vh] overflow-y-auto text-center">
      <div class="flex items-center justify-between gap-2">
        <h2 class="text-lg font-semibold tracking-tight text-white text-center">Quiz</h2>
        <div class="flex items-center justify-center gap-2">
          <span id="quiz-stars-badge"
            class="squircle-pill inline-flex items-center justify-center text-center px-3 py-1 text-xs font-medium bg-amber-300/10 text-amber-200 border border-amber-300/25">
            ★ 0/5
          </span>
          <button id="quiz-close-btn" type="button"
            class="squircle-btn inline-flex items-center justify-center text-center px-3 py-1.5 text-xs font-medium bg-white/[0.08] hover:bg-white/[0.15] text-slate-200">
            Cerrar
          </button>
        </div>
      </div>

      <!-- Selector de los 3 espacios de quiz -->
      <div id="quiz-chapter-tabs" class="flex flex-wrap items-center justify-center text-center gap-2"></div>

      <!-- Contenedor de las 2 preguntas con 4 opciones en blanco -->
      <div id="quiz-questions-container" class="flex flex-col gap-3.5"></div>

      <div class="flex flex-wrap items-center justify-center gap-2 pt-1">
        <button id="quiz-validate-btn" type="button"
          class="squircle-btn inline-flex items-center justify-center text-center px-5 py-2.5 text-sm font-medium bg-white/90 hover:bg-white text-slate-950">
          Validar
        </button>
        <button id="quiz-travel-btn" type="button"
          class="squircle-btn inline-flex items-center justify-center text-center px-5 py-2.5 text-sm font-medium bg-amber-300 hover:bg-amber-200 text-slate-950">
          Viajar
        </button>
      </div>
    </div>
  </div>

  <!-- Modal 3: Pasaporte de Explorador (Sellos de patitas de pingüino) -->
  <div id="passport-modal" class="modal-overlay is-hidden" role="dialog" aria-modal="true" aria-label="Pasaporte">
    <div class="squircle-panel max-w-lg w-full p-6 flex flex-col gap-4 text-center">
      <div class="flex items-center justify-between gap-2">
        <h2 class="text-lg font-semibold tracking-tight text-white text-center">Pasaporte</h2>
        <button id="passport-close-btn" type="button"
          class="squircle-btn inline-flex items-center justify-center text-center px-3 py-1.5 text-xs font-medium bg-white/[0.08] hover:bg-white/[0.15] text-slate-200">
          Cerrar
        </button>
      </div>
      <div id="passport-slots" class="grid grid-cols-3 gap-3"></div>
    </div>
  </div>

  <!-- Modal 4: Estructura de Insignias -->
  <div id="badges-modal" class="modal-overlay is-hidden" role="dialog" aria-modal="true" aria-label="Insignias">
    <div class="squircle-panel max-w-xl w-full p-6 flex flex-col gap-4 text-center">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center justify-center gap-3">
          <h2 class="text-lg font-semibold tracking-tight text-white text-center">Insignias</h2>
          <span id="badges-total-stars"
            class="squircle-pill inline-flex items-center justify-center text-center px-3 py-0.5 text-xs font-medium bg-amber-300/10 text-amber-200 border border-amber-300/20">★ 0/15</span>
        </div>
        <button id="badges-close-btn" type="button"
          class="squircle-btn inline-flex items-center justify-center text-center px-3 py-1.5 text-xs font-medium bg-white/[0.08] hover:bg-white/[0.15] text-slate-200">
          Cerrar
        </button>
      </div>
      <div id="badges-grid" class="grid grid-cols-2 sm:grid-cols-5 gap-2.5"></div>
    </div>
  </div>

  <!-- Modal 5: Certificado Minimalista (solo Certificado, Nivel y Huella del pingüino) -->
  <div id="certificate-modal" class="modal-overlay is-hidden" role="dialog" aria-modal="true" aria-label="Certificado">
    <div class="squircle-panel max-w-md w-full p-6 flex flex-col gap-4 text-center">
      <div class="flex items-center justify-between gap-2">
        <button id="download-certificate-btn" type="button" disabled
          class="squircle-btn inline-flex items-center justify-center text-center px-3.5 py-1.5 text-xs font-medium bg-amber-300 hover:bg-amber-200 text-slate-950">
          Descargar
        </button>
        <button id="certificate-close-btn" type="button"
          class="squircle-btn inline-flex items-center justify-center text-center px-3 py-1.5 text-xs font-medium bg-white/[0.08] hover:bg-white/[0.15] text-slate-200">
          Cerrar
        </button>
      </div>
      <div class="certificate-frame p-8 flex flex-col items-center justify-center gap-5 min-h-[290px] text-center">
        <h2 class="text-2xl font-semibold tracking-tight text-amber-200 text-center">Certificado</h2>
        <p id="certificate-level" class="text-sm font-medium tracking-wide text-cyan-200 text-center"></p>
        <div id="certificate-paw" class="py-1 flex items-center justify-center"></div>
        <!-- Área en blanco para el diseño futuro del texto -->
        <div class="blank-template-slot w-full h-16 flex items-center justify-center text-center"></div>
      </div>
    </div>
  </div>

  <script defer src="js/data.js"></script>
  <script defer src="js/models.js"></script>
  <script defer src="js/tts.js"></script>
  <script defer src="js/fx.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
