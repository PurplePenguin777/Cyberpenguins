<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091228" />
      <stop offset="100%" stop-color="#04060f" />
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ee8fa" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Fondo circular oscuro -->
  <circle cx="64" cy="64" r="62" fill="url(#pbg)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- Casco exterior espacial -->
  <circle cx="64" cy="62" r="46" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
  <circle cx="64" cy="62" r="41" fill="#0f172a" />

  <!-- Visor dorado / cian polarizado -->
  <ellipse cx="64" cy="60" rx="34" ry="26" fill="url(#visor)" />

  <!-- Reflejo curvo del visor -->
  <path d="M 40,50 Q 64,40 88,50 Q 78,43 50,45 Z" fill="url(#glint)" />

  <!-- Pico naranja de Cyberpenguin dentro del visor -->
  <polygon points="64,68 56,60 72,60" fill="#fb923c" stroke="#ea580c" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Luces de comunicación en el borde del casco -->
  <circle cx="21" cy="62" r="4.5" fill="#38bdf8" opacity="0.9" />
  <circle cx="107" cy="62" r="4.5" fill="#38bdf8" opacity="0.9" />
  <rect x="23" y="60" width="5" height="4" fill="#64748b" />
  <rect x="100" y="60" width="5" height="4" fill="#64748b" />

  <!-- Cuello del traje presurizado -->
  <path d="M 38,98 Q 64,90 90,98 L 94,116 Q 64,122 34,116 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
  <line x1="64" y1="95" x2="64" y2="119" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
</svg>
